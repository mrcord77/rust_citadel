[package]
name = "citadel-envelope"
version = "3.1.0"
edition = "2021"
rust-version = "1.81"
description = "Citadel Envelope v1: X25519 + ML-KEM-768 + AES-256-GCM post-quantum hybrid encryption"
license = "MIT OR Apache-2.0"
repository = "https://github.com/example/citadel-envelope"
keywords = ["cryptography", "post-quantum", "encryption", "ml-kem", "hybrid", "x25519"]
categories = ["cryptography", "no-std"]

[lib]
name = "citadel_envelope"
path = "src/lib.rs"

[dependencies]
# ML-KEM (FIPS 203) - production-grade PQ KEM
ml-kem = { version = "0.2", features = ["zeroize"] }

# X25519 - classical ECDH for hybrid defense-in-depth
x25519-dalek = { version = "2.0", features = ["static_secrets", "zeroize"] }

# Symmetric cryptography
aes-gcm = { version = "0.10", features = ["aes"] }
hkdf = "0.12"
sha2 = "0.10"
sha3 = "0.10"

# Constant-time operations
subtle = "2.5"

# Secure random number generation
rand_core = { version = "0.6", features = ["getrandom"] }
getrandom = "0.2"

# Memory zeroing for sensitive data
zeroize = { version = "1.7", features = ["derive"] }

[dev-dependencies]
hex = "0.4"

[features]
default = []
# Deterministic mode for Known Answer Tests - NEVER use in production
kat = []
# Enable std features (error trait implementations)
std = []

[profile.release]
lto = true
codegen-units = 1
panic = "unwind"

[profile.dev]
# Faster dev builds
opt-level = 1

[[example]]
name = "timing_analysis"
path = "examples/timing_analysis.rs"

[[example]]
name = "generate_vectors"
path = "examples/generate_vectors.rs"

