[package]
name = "citadel-api"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "REST API layer for the Citadel post-quantum encryption ecosystem"
license = "AGPL-3.0-or-later"
repository = "https://github.com/mrcord77/rust_citadel"
keywords = ["cryptography", "post-quantum", "encryption", "api", "rest"]
categories = ["cryptography", "web-programming::http-server"]

[[bin]]
name = "citadel-api"
path = "src/main.rs"

[[bin]]
name = "hash-apikey"
path = "src/hash_apikey.rs"

[dependencies]
axum = { version = "0.7", features = ["macros"] }
chrono = { version = "0.4", features = ["serde"] }
citadel-envelope = { path = "../citadel-envelope" }
citadel-keystore = { path = "../citadel-keystore" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
sha2 = "0.10"
subtle = "2"
hex = "0.4"
getrandom = "0.2"
